<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030303">
    <title>For Chuiimuii 🌹</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="experience">

        <!-- Ambient background -->
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <!-- Tiny floating particles -->
        <div id="particles"></div>

        <!-- Initial screen -->
        <section id="opening">

            <div class="opening-glow"></div>

            <div class="opening-content">
                <div class="tiny-line"></div>

                <p class="opening-small">
                    A little something
                </p>

                <h1>
                    for
                    <span>Chuiimuii</span>
                </h1>

                <button id="startButton" aria-label="Open the surprise">
                    <span class="button-ring"></span>
                    <span class="button-text">Tap to begin</span>
                </button>

                <p class="opening-hint">
                    headphones recommended
                </p>
            </div>

        </section>

        <!-- Main cinematic scene -->
        <main id="scene">

            <div class="moon-glow"></div>

            <!-- Bouquet -->
            <div id="bouquet">

                <!-- Back flowers -->
                <div class="flower flower-back flower-1">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-deep">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <div class="flower flower-back flower-2">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-wine">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <div class="flower flower-back flower-3">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-soft">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <!-- Middle flowers -->
                <div class="flower flower-middle flower-4">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-red">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <div class="flower flower-middle flower-5">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-pink">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <div class="flower flower-middle flower-6">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-burgundy">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <!-- Front flowers -->
                <div class="flower flower-front flower-7">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-red">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <div class="flower flower-front flower-8">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-wine">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <div class="flower flower-front flower-9">
                    <div class="stem"></div>
                    <div class="leaf leaf-left"></div>
                    <div class="leaf leaf-right"></div>
                    <div class="rose rose-soft">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span>
                    </div>
                </div>

                <!-- Tiny filler flowers -->
                <div class="filler filler-1"><i></i><i></i><i></i><i></i></div>
                <div class="filler filler-2"><i></i><i></i><i></i><i></i></div>
                <div class="filler filler-3"><i></i><i></i><i></i><i></i></div>
                <div class="filler filler-4"><i></i><i></i><i></i><i></i></div>

                <!-- Bouquet wrap -->
                <div id="wrap">
                    <div class="paper paper-left"></div>
                    <div class="paper paper-right"></div>
                    <div class="paper-front"></div>

                    <div class="ribbon">
                        <div class="ribbon-left"></div>
                        <div class="ribbon-right"></div>
                        <div class="ribbon-knot"></div>
                    </div>
                </div>

            </div>

            <!-- Final message -->
            <div id="finalMessage">

                <div class="message-line"></div>

                <p class="for-you">
                    for the girl who makes my world softer
                </p>

                <h2>
                    I loveeeeeeeeeuuuuuuuuuuuuu
                    <span>Chuiimuii</span>
                </h2>

                <div class="message-heart">♡</div>

            </div>

        </main>

        <audio id="loveSong" preload="auto">
            <source src="love-song.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script src="script.js"></script>
</body>
</html>
